[package]
name = "mvdz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lossless, format-aware compression of QuakeWorld MVD demos"
documentation = "https://github.com/galfthan/mvdz"
readme = "../../README.md"
keywords = ["quakeworld", "mvd", "demo", "compression", "rans"]
categories = ["compression", "game-development"]
exclude = ["/fuzz"]

[features]
fuzz = []
# measurements: examples/stats.rs
stats = []

[dependencies]
sha2 = { workspace = true }
crc32fast = { workspace = true }

[dev-dependencies]
mvdz = { path = ".", features = ["stats"] }
anyhow = { workspace = true }
criterion = { workspace = true }
pretty_assertions = { workspace = true }

# needs MVDZ_BENCH_DEMOS
[[bench]]
name = "codec"
harness = false

[[example]]
name = "stats"
required-features = ["stats"]

[lints]
workspace = true
