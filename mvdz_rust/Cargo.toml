[workspace]
members = ["mvdz", "mvdz_cli"]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.4"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/galfthan/mvdz"

[workspace.dependencies]
mvdz = { path = "mvdz" }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# the CRC-32 of zlib
crc32fast = { version = "1", default-features = false, features = ["std"] }
# raw DEFLATE, the format's general-purpose compressor: pure Rust, so no C
# code and the same on wasm
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
# benches/codec.rs; no plots and no rayon: the statistics and the baseline
# comparison are what is used
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

# release code without LTO, for quick test and benchmark builds
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
debug = 0

[workspace.lints.rust]
# no unsafe code anywhere: library, tool, tests, examples, benchmarks
unsafe_code = "forbid"
# `pub` only where something outside the crate names it
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Stylistic, not bugs
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"

# Narrowing casts are bounded, not lossy: positions and lengths by the
# 1 MiB segment and 16 MiB models caps, small values by a clamp or range
# just before. Only the entropy coders and varints drop high bits, on purpose.
cast_possible_truncation = "allow"

# The hot loops (walker, rANS, numeric groups) keep their written form,
# which was benchmarked: parallel arrays indexed by one counter, forced
# inlining
needless_range_loop = "allow"
inline_always = "allow"

# Not followed yet: each is removed with the step that fixes its findings
many_single_char_names = "allow"       # 21, naming

# No panics
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
