[workspace]
members = ["mvdz", "mvdz_cli"]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.4"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/galfthan/mvdz"

[workspace.dependencies]
mvdz = { path = "mvdz" }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
crc32fast = { version = "1", default-features = false, features = ["std"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
# no plots and no rayon: only the statistics and baseline comparison are used
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
pretty_assertions = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

# release code without LTO, for quick test and benchmark builds
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
debug = 0

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Stylistic, not bugs
assert_is_empty = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
too_many_lines = "allow"

# Narrowing casts are bounded, not lossy: positions and lengths by the
# 1 MiB segment and 16 MiB models caps, small values by a clamp or range
# just before. Only the entropy coders drop high bits, on purpose.
cast_possible_truncation = "allow"

# Forced inlining in the hot loops (walker, rANS, numeric groups) was
# benchmarked
inline_always = "allow"

# No panics
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
