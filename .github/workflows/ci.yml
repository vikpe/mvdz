name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The Rust implementation is in mvdz_rust
defaults:
  run:
    working-directory: mvdz_rust

# Linux only. Other platforms build from source with cargo but are not
# tested here.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cd mvdz/fuzz && cargo fmt --check
      - run: cargo clippy --profile fast --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # tests that need real demos skip without MVDZ_TEST_DATA
      # (scripts/fetch_samples.sh sample40 DIR/sample downloads them)
      - run: cargo nextest run --cargo-profile fast
      # nextest does not run the documentation examples
      - run: cargo test --profile fast --doc

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown
