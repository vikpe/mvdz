name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The Rust implementation is in mvdz_rust
defaults:
  run:
    working-directory: mvdz_rust

# Rust and Go: Linux only. Other platforms build from source but are not
# tested here. C: Linux, macOS and Windows.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cd mvdz/fuzz && cargo fmt --check
      - run: cargo clippy --profile fast --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # the tests that need real demos read $MVDZ_TEST_DATA/sample
      - uses: actions/cache@v4
        id: sample8
        with:
          path: testdata/sample
          key: sample8-${{ hashFiles('benchmarks/samples/sample8.txt') }}
      - if: steps.sample8.outputs.cache-hit != 'true'
        run: ../scripts/fetch_samples.sh sample8 ../testdata/sample
      - run: cargo nextest run --cargo-profile fast
        env:
          MVDZ_TEST_DATA: ${{ github.workspace }}/testdata
      # nextest does not run the documentation examples
      - run: cargo test --profile fast --doc

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvdz_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mvdz_go/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  c:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvdz_c
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make format-check
      # warnings are errors (Makefile)
      - run: make test CC=${{ matrix.compiler }}
      - run: make test SANITIZE=1 CC=${{ matrix.compiler }}
      - if: matrix.compiler == 'clang'
        run: make fuzz FUZZ_SECS=60

  c-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mvdz_c
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make test SANITIZE=1

  c-msvc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mvdz_c
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cl /nologo /W3 tests\test.c /Fe:test.exe
      - run: test.exe ..\vectors
