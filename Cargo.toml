[package]
name = "mvdz"
version = "1.0.0-rc.4"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Lossless, format-aware compression of QuakeWorld MVD demos"
repository = "https://github.com/galfthan/mvdz"
homepage = "https://github.com/galfthan/mvdz"
documentation = "https://github.com/galfthan/mvdz"
readme = "README.md"
keywords = ["quakeworld", "mvd", "demo", "compression", "rans"]
categories = ["compression", "game-development", "command-line-utilities"]
exclude = ["/fuzz", "/interop", "/scripts", "/.github"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
sha2 = "0.10"
# the CRC-32 of zlib; flate2 depends on it already
crc32fast = "1"
# raw DEFLATE, the format's general-purpose compressor, and gzip input (most
# archives hand out .mvd.gz): the pure-Rust miniz_oxide back end, so no C
# code and the same on wasm
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# the tests parse the JSON of `mvdz info`
[dev-dependencies]
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", optional = true, default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

# release code without LTO, for quick test and benchmark builds
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
debug = 0

[features]
# mimalloc as the command-line tool's allocator: musl's own allocator makes
# the static release builds 15-40 % slower (BENCHMARKS.md)
mimalloc = ["dep:mimalloc"]
# force the portable (non-SIMD) code paths, to test the fallbacks used on
# wasm32 and other targets
scalar = []

# Style lints the code deliberately does not follow: the C ABI's safety
# contract is documented once, in include/mvdz.h; the hot loops (walker,
# rANS, numeric groups, CRC) index several parallel arrays and keep their
# written form, which was benchmarked.
[lints.clippy]
missing_safety_doc = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
len_without_is_empty = "allow"
precedence = "allow"
manual_div_ceil = "allow"
chunks_exact_to_as_chunks = "allow"
